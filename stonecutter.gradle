// Stonecutter の親のビルド (#112)。src/ のソースを版ごとに書き分け (//? if ...) で切り替え、versions/<版>/ で jar を作る。
// 版ごとのビルドの中身は build.gradle。いま IDE で開いている版 (active) は下の 1 行で決まる (./gradlew "Set active project to <版>" で変える)
plugins {
	id 'dev.kikugie.stonecutter'
}

stonecutter.active '26.3'

// 全部の版の jar をまとめて作る (./gradlew build でも同じ。版の一覧の確認用に名前を付けておく)
tasks.register('buildAllVersions') {
	group = 'build'
	description = 'Builds the jar for every Minecraft version'
	dependsOn subprojects.collect { "${it.path}:build" }
}
