# メモリの少ない環境向けに 2G に抑える
org.gradle.jvmargs=-Xmx2G
org.gradle.parallel=true

# Fabric (https://fabricmc.net/develop で確認)。マイクラの版ごとの依存は versions/<版>/gradle.properties (#112)
loader_version=0.19.5
# loom-back-compat が使う Loom の版 (難読化なしの版は net.fabricmc.fabric-loom、難読化ありの版は fabric-loom-remap)
loomx.loom_version=1.18.4

# MOD。jar は redtact-<mod_version>+<マイクラの版>.jar
mod_version=0.2.0
group=com.redtact.live

junit_version=5.12.2

# 1.21.x のゲームテストで、remap した MOD の同梱の jar の代わりに入れるもの (build.gradle。#112)
# Litematica・MaLiLib が同梱する conditional-mixin と、MCEF Modern 0.3.3 が同梱する jcefmaven (jcef 146)
conditional_mixin_version=0.6.4
jcefmaven_version=146.0.10

# @Nullable などの注釈 (1.21.10 まではゲームに無い。build.gradle)
jspecify_version=1.0.0
