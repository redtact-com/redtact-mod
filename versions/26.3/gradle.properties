# Minecraft 26.3 向けのビルド (#112。版で変わるものだけ。共通は ../../gradle.properties)
minecraft_version=26.3
# fabric.mod.json の depends.minecraft
minecraft_dependency=~26.3
# 26.1 からは Java 25 (1.21.x は 21)
java_version=25

fabric_api_version=0.162.0+26.3
# malilib 0.30.2 (Minecraft 26.3 向け、LGPL-3.0)。Litematica 連携のコンパイル時と gametest の実行時だけ (この MOD は使わない)。Modrinth のバージョン ID
malilib_version=JX9bESec
# Litematica 0.29.1 (Minecraft 26.3 向け、LGPL-3.0、malilib >=0.30.2 <0.31.0)。任意の依存。Modrinth のバージョン ID
litematica_version=ZqV316KY
# fabric.mod.json の suggests の下限
litematica_min=0.29.1
# MCEF Modern 0.3.3+mc26.3 (LGPL-2.1、Chromium をゲーム内に出す)。任意の依存 (#46)。Modrinth のバージョン ID
mcef_modern_version=dwiy9wKy
mcef_modern_min=0.3.3
# MCEF Modern 0.3.3 が同梱している jcef の API (org.cef.*)。コンパイル時だけ参照する
jcef_api_version=jcef-d3de827+cef-146.0.10+g8219561+chromium-146.0.7680.179
